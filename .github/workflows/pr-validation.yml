name: PR validation (no services)

on:
  pull_request:
    paths:
      - "queue_scheduler/cloud_state.py"
      - "scripts/private_queue_upload.py"
      - ".github/workflows/private-youtube-test.yml"
      - ".github/workflows/pr-validation.yml"
      - "queue-state/state.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile Python files
        run: python -m py_compile queue_scheduler/cloud_state.py scripts/private_queue_upload.py

      - name: Check direct script import path
        run: python scripts/private_queue_upload.py --help

      - name: Validate upload workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/private-youtube-test.yml', encoding='utf-8')); print('Upload workflow YAML: valid')"

      - name: Validate queue state JSON schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("queue-state/state.json").read_text(encoding="utf-8"))
          assert isinstance(state, dict), "state must be an object"
          assert state.get("schema_version") == 1, "schema_version must be 1"
          assert isinstance(state.get("items"), dict), "items must be an object"
          print("Queue state JSON and schema: valid")
          PY

      - name: Assert this workflow cannot upload
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.load(Path(".github/workflows/pr-validation.yml").read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          triggers = workflow["on"]
          assert set(triggers) == {"pull_request", "workflow_dispatch"}
          assert workflow["permissions"] == {"contents": "read"}
          steps = workflow["jobs"]["validate"]["steps"]
          assert all(not step.get("uses", "").startswith("./.github/workflows/") for step in steps)

          def values(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      yield from values(key)
                      yield from values(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from values(item)
              elif isinstance(value, str):
                  yield value

          secret_prefix = "${{ " + "sec" + "rets."
          assert not any(secret_prefix in value for value in values(workflow))
          print("Validation workflow has no upload trigger, reusable upload workflow, write permission, or secret reference.")
          PY
