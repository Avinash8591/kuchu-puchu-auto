name: YouTube private test upload

on:
  workflow_dispatch:
    inputs:
      filename:
        description: Exact Dropbox MP4 filename (not a path)
        required: true
        type: string
      title:
        description: Human-reviewed title based on the actual video content
        required: true
        type: string
      description:
        description: Human-reviewed description based on the actual video content
        required: true
        type: string
      confirm_upload:
        description: Type UPLOAD_PRIVATE_TEST to authorize one private test upload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kuchu-puchu-private-upload
  queue: max

jobs:
  upload-one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private test confirmation
        env:
          CONFIRM: ${{ inputs.confirm_upload }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "UPLOAD_PRIVATE_TEST" ]]; then
            echo "::error::Exact private test confirmation is required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service clients
        run: python -m pip install --disable-pip-version-check dropbox google-api-python-client google-auth

      - name: Confirm existing secrets are present
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DROPBOX_APP_KEY DROPBOX_REFRESH_TOKEN YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is missing."
              exit 1
            fi
          done
          echo "Required existing secret names are configured; no values were printed."

      - name: Download selected Dropbox file and upload privately
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATE_BRANCH: ${{ github.event.repository.default_branch }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SELECTED_FILENAME: ${{ inputs.filename }}
          REVIEWED_TITLE: ${{ inputs.title }}
          REVIEWED_DESCRIPTION: ${{ inputs.description }}
        run: >-
          python scripts/private_queue_upload.py
          --filename "$SELECTED_FILENAME"
          --title "$REVIEWED_TITLE"
          --description "$REVIEWED_DESCRIPTION"
