name: Kuchu Puchu first batch scheduler

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight checks files and settings only; schedule uploads are publicly released at their scheduled times
        required: true
        type: choice
        options:
          - preflight
          - schedule
      approval:
        description: For a live public schedule only, enter APPROVE FIRST BATCH PUBLIC SCHEDULE after reviewing the PR and schedule conflicts
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kuchu-puchu-first-batch-scheduler
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned API dependencies
        run: python -m pip install --disable-pip-version-check 'dropbox==12.0.2' 'google-api-python-client==2.149.0' 'google-auth==2.35.0' 'google-auth-httplib2==0.2.0'

      - name: Run guarded batch workflow
        env:
          RUN_MODE: ${{ inputs.mode }}
          APPROVE_PUBLIC_SCHEDULING: ${{ inputs.approval }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/youtube_batch_scheduler.py

      - name: Persist upload ledger
        if: always()
        run: |
          if [ -f state/batch-01-ledger.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/batch-01-ledger.json
            if ! git diff --cached --quiet; then
              git commit -m "Record first batch YouTube upload state"
              git push
            fi
          fi
