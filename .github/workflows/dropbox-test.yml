name: Dropbox connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dropbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Dropbox folder access
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: python scripts/dropbox_test.py
